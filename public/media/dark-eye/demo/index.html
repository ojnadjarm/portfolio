<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>The Dark Eye</title>
<link id="fav" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23030604'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='6' fill='none' stroke='%234dffa0' stroke-width='1.5'/%3E%3Cellipse cx='16' cy='16' rx='3' ry='5' fill='%23b04dff'/%3E%3C/svg%3E">
<style>
  /* the Swarm's language: black ground, mint is alive, gold is him and what needs him, violet is rare */
  :root {
    --bg: #000;
    --bg1: #030503;
    --line: rgba(77, 255, 160, 0.14);
    --line2: rgba(77, 255, 160, 0.22);
    --line3: rgba(77, 255, 160, 0.38);
    --g: #4dffa0;
    --g2: #9fffc8;
    --hi: #eafff2;
    --gold: #ffd166;
    --gold2: #fff2cd;
    --vio: #b04dff;
    --mute: #6a8a7a;
    --mid: #83a08f;
    --txt: #c2d3c8;
    --mono: ui-monospace, "SF Mono", "DejaVu Sans Mono", "Cascadia Mono", Menlo, monospace;
    --kana: "Noto Sans Mono CJK JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", ui-monospace, monospace;
    --ei: cubic-bezier(0.12, 0.9, 0.24, 1);
    --gut: clamp(16px, 3vw, 56px);
    --glass: color-mix(in srgb, var(--bg1) 72%, transparent);
  }
  * { box-sizing: border-box; }
  html { height: 100%; background: var(--bg); font-size: clamp(14px, calc(10px + 0.3vw), 18px); }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    color: var(--txt);
    font: 1rem/1.6 var(--mono);
    -webkit-text-size-adjust: 100%;
  }
  :focus-visible { outline: 1px solid var(--g2); outline-offset: 4px; }
  .hide { display: none !important; }

  /* -- the swarm fills the page behind everything; the creatures' names ride above it */
  #eye { position: fixed; inset: 0; z-index: -1; display: block; width: 100%; height: 100%; pointer-events: none; }
  #court { position: fixed; inset: 0; overflow: hidden; pointer-events: none; contain: strict; transition: opacity 0.25s var(--ei); }
  #talk:has(#halo:not([hidden])) #court, #talk:has(#all:not([hidden])) #court { opacity: 0.15; }
  .otag {
    position: absolute; left: 0; top: 0;
    padding: 0.05rem 0.45rem;
    border-left: 2px solid var(--g);
    background: rgba(0, 0, 0, 0.62);
    color: var(--mid);
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    will-change: transform;
  }
  .otag b { color: var(--g2); font-weight: 600; letter-spacing: 0.06em; }

  /* -- the lockup, the agents at work, the small-window glyph ------------------ */
  #top {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    min-height: 3.2rem;
    padding: max(6px, env(safe-area-inset-top)) max(var(--gut), env(safe-area-inset-right)) 0 max(var(--gut), env(safe-area-inset-left));
  }
  .brand { display: flex; align-items: baseline; gap: 0.75rem; min-width: 0; white-space: nowrap; }
  .brand b { color: var(--hi); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; }
  .brand b::before { content: "\25c6\00a0"; color: var(--g); text-shadow: 0 0 12px var(--g); }
  .brand span { color: var(--mute); font-size: 0.64rem; letter-spacing: 0.24em; text-transform: uppercase; }
  #crowd {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    color: var(--mid);
    font-size: 0.64rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #crowd::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--g); box-shadow: 0 0 10px var(--g); animation: beat 2.4s ease-in-out infinite; will-change: transform, opacity; }
  #crowd[hidden] { display: none; }
  @keyframes beat { 50% { opacity: 0.35; transform: scale(0.7); } }
  #pip {
    -webkit-appearance: none;
    appearance: none;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    margin: 0 -10px 0 auto;
    padding: 0;
    background: none;
    border: 0;
    color: var(--mid);
    opacity: 0.6;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #crowd:not([hidden]) ~ #pip { margin-left: 0; }
  #pip svg { width: 18px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.4; }
  #pip svg rect.in { fill: currentColor; stroke: none; }
  #pip:hover, #pip:focus-visible { opacity: 1; color: var(--hi); }
  #pip[aria-pressed="true"] { opacity: 1; color: var(--accent, var(--g)); }
  #snd { -webkit-appearance: none; appearance: none; display: grid; place-items: center; width: 44px; height: 44px; margin: 0 -10px 0 auto; padding: 0; background: none; border: 0; color: var(--mid); opacity: 0.6; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #crowd:not([hidden]) ~ #snd, #snd ~ #pip { margin-left: 0; }
  #snd svg { width: 19px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  #snd[data-on="false"] .w, #snd[data-on="true"] .x { display: none; }
  #snd:hover, #snd:focus-visible, #snd[aria-expanded="true"] { opacity: 1; color: var(--hi); }
  #sndp { position: absolute; z-index: 30; top: calc(3.2rem + max(6px, env(safe-area-inset-top))); right: max(var(--gut), env(safe-area-inset-right)); display: flex; align-items: center; gap: 0.9rem; max-width: calc(100vw - 2 * var(--gut)); padding: 0.55rem 0.9rem 0.55rem 0.55rem; background: var(--glass); border: 1px solid var(--line2); border-radius: 3px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #sndp[hidden] { display: none; }
  #sndon { font: inherit; font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; white-space: nowrap; min-height: 36px; padding: 0 0.8rem; color: var(--mid); background: none; border: 1px solid var(--line); border-radius: 2px; cursor: pointer; }
  #sndon[aria-pressed="true"] { color: var(--g2); border-color: var(--line3); }
  #vol { flex: none; width: clamp(6rem, 34vw, 11rem); min-height: 36px; padding: 0; background: none; border: 0; box-shadow: none; accent-color: var(--g); }

  /* -- the page: the words over the eye on a phone, beside it on a wide screen ---- */
  main {
    min-height: 0;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas: "log" "talk";
    padding: 0 max(var(--gut), env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(var(--gut), env(safe-area-inset-left));
  }
  #gate, #log { grid-area: log; min-height: 0; width: 100%; max-width: 46rem; justify-self: center; }
  #talk { grid-area: talk; }

  /* -- the key, pasted once and never kept ---------------------------------- */
  #gate { display: grid; align-content: end; justify-items: center; gap: 0.9rem; padding-bottom: 1.2rem; text-align: center; animation: rise 0.6s var(--ei); }
  #gate p { margin: 0; color: var(--mid); font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; }
  #gate form { display: flex; gap: 0.5rem; width: min(100%, 22rem); }
  #refused { min-height: 1.5em; color: var(--gold); font-size: 0.8rem; }
  input {
    flex: 1; min-width: 0;
    min-height: max(2.75rem, 44px);
    padding: 0 1rem;
    background: var(--glass);
    border: 1px solid var(--line2);
    border-radius: 2px;
    color: var(--hi);
    font: inherit;
    letter-spacing: 0.14em;
  }
  input:focus { outline: none; border-color: var(--line3); box-shadow: 0 0 26px -10px var(--g); }
  button.plain {
    min-height: max(2.75rem, 44px);
    padding: 0 1.1rem;
    background: var(--glass);
    border: 1px solid var(--line3);
    border-radius: 2px;
    color: var(--g);
    font: inherit;
    font-size: 0.74rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.12s var(--ei);
  }
  button.plain:hover { border-color: var(--g); box-shadow: 0 0 24px -8px var(--g); }
  button.plain:active { transform: scale(0.96); }
  @keyframes rise { from { opacity: 0; } }

  /* -- what was said: his lines gold, the Eye's mint, both decoding out of noise */
  #log {
    overflow-y: auto;
    overscroll-behavior: contain;
    display: flex;
    flex-direction: column;
    gap: 1.15rem;
    padding: 1.4rem 0.2rem 1rem;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 2.6rem);
    mask-image: linear-gradient(to bottom, transparent, #000 2.6rem);
    animation: rise 0.6s var(--ei);
    transition: opacity 0.25s var(--ei);
  }
  #log::-webkit-scrollbar { display: none; }
  #log::before { content: ""; margin-top: auto; } /* newest at the bottom, breathing just above the eye */
  .line {
    position: relative;
    margin: 0;
    padding-left: 1rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    transition: opacity 0.4s ease-in-out;
    animation: line-in 0.45s var(--ei);
  }
  .line::before { content: ""; position: absolute; left: 0; top: 0.35em; bottom: 0.35em; width: 2px; background: currentColor; opacity: 0.6; box-shadow: 0 0 10px currentColor; }
  .line:not(:nth-last-child(-n+2)) { opacity: 0.5; }
  .line.me { color: var(--gold); text-shadow: 0 0 14px rgba(255, 209, 102, 0.2); }
  .line.eye { color: var(--g2); text-shadow: 0 0 14px rgba(77, 255, 160, 0.18); }
  .line .h { color: var(--hi); }
  .line.me .h { color: var(--gold2); }
  .line .n { color: rgba(77, 255, 160, 0.4); font-family: var(--kana); text-shadow: none; }
  .line.me .n { color: rgba(255, 209, 102, 0.4); }
  @keyframes line-in { from { opacity: 0; } }
  /* a link he can tap: one hairline card, the title, the host in small caps, a new tab */
  .line.link { padding-left: 0; }
  .line.link::before { content: none; }
  .line.link a {
    position: relative;
    display: block;
    padding: 0.8rem 2.6rem 0.8rem 1rem;
    border: 1px solid var(--line3);
    background: var(--glass);
    color: var(--hi);
    text-decoration: none;
    text-shadow: none;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.12s var(--ei);
  }
  .line.link a::before { content: ""; position: absolute; left: -1px; top: -1px; width: 10px; height: 10px; border: solid var(--g); border-width: 1px 0 0 1px; }
  .line.link a::after { content: "\2197"; position: absolute; right: 1rem; top: 0.8rem; color: var(--g); text-shadow: 0 0 10px var(--g); }
  .line.link a:hover, .line.link a:focus-visible { border-color: var(--g); box-shadow: 0 0 28px -10px var(--g); outline: none; }
  .line.link a:active { transform: scale(0.985); }
  .line.link .host { display: block; margin-top: 0.3rem; color: var(--mid); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; }
  .line button {
    display: inline-block; margin: 0.5rem 0 0; padding: 0.2rem 0.8rem;
    background: transparent; border: 1px solid var(--line2); border-radius: 2px;
    color: var(--g); font: inherit; font-size: 0.75rem; cursor: pointer;
  }
  /* hear that one: it is on a line only while something of that reply is unheard,
     so it always reads as a full tray and never as anything held back */
  .line button.play {
    position: relative;
    display: inline-grid; place-items: center; vertical-align: -3px;
    width: 22px; height: 18px; margin: 0 0 0 6px; padding: 0;
    background: none; border: 0; border-radius: 3px;
    color: var(--accent, var(--g)); cursor: pointer;
    filter: drop-shadow(0 0 6px var(--accent, var(--g)));
    -webkit-tap-highlight-color: transparent;
  }
  /* the thumb's share of it: a 44 px target around the same 22x18 picture */
  .line button.play::after {
    content: "";
    position: absolute; top: 50%; left: 50%;
    width: 44px; height: 44px;
    transform: translate(-50%, -50%);
  }
  .line button.play:first-child { margin-left: 0; } /* a held reply is the glyph alone, no words beside it */
  .line button.play svg { width: 10px; height: 11px; fill: currentColor; stroke: none; }
  .line button.play:disabled { opacity: 0.4; cursor: default; }
  /* its voice is still being made: a dim dot holds the glyph's own box and breathes */
  .line span.wait {
    display: inline-grid; place-items: center; vertical-align: -3px;
    width: 22px; height: 18px; margin: 0 0 0 6px;
    color: var(--accent, var(--g)); opacity: 0.3;
  }
  .line span.wait::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor;
    animation: wait-breath 2.6s ease-in-out infinite;
  }
  .line span.wait:first-child { margin-left: 0; }
  @keyframes wait-breath {
    0%, 100% { opacity: 0.5; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* -- the eye's caption: whose line it is, then the mode, as two buttons ------ */
  #caption {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 0.3rem;
  }
  #caption .sep { display: none; }
  .word, #more {
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    min-height: max(2.75rem, 44px);
    padding: 0 1rem;
    background: var(--glass);
    border: 1px solid var(--line2);
    border-radius: 2px;
    color: var(--txt);
    font: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.26s ease-in-out, border-color 0.2s, box-shadow 0.2s, transform 0.12s var(--ei);
  }
  .word:hover, .word:focus-visible, #more:hover, #more:focus-visible { border-color: var(--line3); }
  .word:active, #more:active { transform: scale(0.96); box-shadow: 0 0 22px -6px var(--g); }
  .word:disabled { cursor: default; opacity: 0.6; }
  #chan { color: var(--accent, var(--g)); border-color: color-mix(in srgb, var(--accent, var(--g)) 45%, transparent); }
  #chan[aria-expanded="true"] { box-shadow: 0 0 26px -8px var(--accent, var(--g)); }
  /* the colour is the identity, so it is drawn, not implied by the word's ink */
  #chan .lz { width: 7px; height: 7px; flex: none; background: currentColor; box-shadow: 0 0 10px currentColor; transform: rotate(45deg); }
  #mode { color: var(--g2); }
  #mode[data-mode="notes"] { color: var(--hi); }
  .mi { width: 17px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; flex: none; }
  .mi .dot { fill: currentColor; stroke: none; }
  #more { padding: 0 0.9rem; color: var(--mid); }
  #more[hidden] { display: none; }

  /* -- the halo: the ones he used last as two-letter marks curved over the lid, one tap each */
  #halo {
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    top: var(--lid, 40px);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: clamp(4px, 2.4vw, 28px);
    pointer-events: none;
  }
  #halo[hidden] { display: none; }
  #halo .arcmark {
    -webkit-appearance: none;
    appearance: none;
    position: relative;
    display: grid;
    justify-items: center;
    gap: 2px;
    min-width: 46px;
    padding: 6px 6px 4px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid var(--line);
    border-radius: 2px;
    color: inherit;
    font: inherit;
    cursor: pointer;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
  }
  /* the arc: the outer marks sit lower, so the row curves over the lid; two or three sit level */
  #halo[data-n="4"] .arcmark:nth-child(1), #halo[data-n="4"] .arcmark:nth-child(4) { transform: translateY(19px); }
  #halo[data-n="4"] .arcmark:nth-child(2), #halo[data-n="4"] .arcmark:nth-child(3) { transform: translateY(3px); }
  #halo[data-n="5"] .arcmark:nth-child(1), #halo[data-n="5"] .arcmark:nth-child(5) { transform: translateY(24px); }
  #halo[data-n="5"] .arcmark:nth-child(2), #halo[data-n="5"] .arcmark:nth-child(4) { transform: translateY(7px); }
  #halo .arcmark .mk { font-size: 0.9rem; font-weight: 600; letter-spacing: 0.1em; opacity: 0.6; }
  #halo .arcmark .nm {
    max-width: 62px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: var(--mid);
    font-size: 0.58rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.75;
  }
  /* the one that hears him: full light and a solid hairline, a shape as well as a colour */
  #halo .arcmark[aria-current="true"] { border-color: currentColor; box-shadow: 0 0 20px -8px currentColor; }
  #halo .arcmark[aria-current="true"] .mk { opacity: 1; text-shadow: 0 0 14px currentColor; }
  #halo .arcmark[aria-current="true"] .nm { color: currentColor; opacity: 0.95; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  /* not listening: dimmer, a dotted line under its letters, never the solid one */
  #halo .arcmark[data-off="1"] .mk { opacity: 0.34; border-bottom: 1px dotted currentColor; }
  #halo .arcmark:hover .mk, #halo .arcmark:focus-visible .mk { opacity: 0.9; }
  /* replies it is holding for him: a dot here, the number in the index */
  #halo .arcmark .wd { position: absolute; top: 3px; right: 4px; width: 5px; height: 5px; background: currentColor; border-radius: 50%; box-shadow: 0 0 7px currentColor; }
  #halo .arcmark::after { content: ""; position: absolute; top: 50%; left: 50%; width: 46px; height: 44px; transform: translate(-50%, -50%); }

  /* -- the index: everything the body reports, at any roster size, rising above the eye */
  #all {
    position: absolute;
    z-index: 3;
    bottom: calc(100% + 8px);
    left: 0; right: 0;
    margin: 0 auto;
    width: min(100%, 26rem);
    max-height: min(52vh, 420px);
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    display: grid;
    gap: 2px;
    padding: 0.7rem;
    background: #030503;
    border: 1px solid var(--line2);
    box-shadow: 0 0 46px 20px rgba(0, 0, 0, 0.95);
    text-align: left;
  }
  #all[hidden] { display: none !important; }
  @media not all and (min-width: 640px) and (min-aspect-ratio: 5/4) { main:has(#all:not([hidden])) > #log { opacity: 0.12; } }
  #all .ent {
    -webkit-appearance: none;
    appearance: none;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    min-height: 44px;
    padding: 0 0.4rem;
    background: none;
    border: 0;
    color: inherit;
    cursor: pointer;
    font: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }
  #all .ent:hover, #all .ent:focus-visible { background: rgba(77, 255, 160, 0.05); }
  #all .ent .lz { width: 6px; height: 6px; flex: none; background: currentColor; transform: rotate(45deg); }
  /* not listening: a hollow mark, so the row reads as absent without its colour */
  #all .ent[data-off="1"] .lz { background: none; box-shadow: inset 0 0 0 1px currentColor; }
  #all .ent .nm { color: var(--txt); opacity: 0.7; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #all .ent[aria-current="true"] .nm { color: currentColor; opacity: 1; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  #all .ent:hover .nm, #all .ent:focus-visible .nm { opacity: 0.9; }
  #all .ent .mt { flex: none; margin-left: auto; padding-left: 0.5rem; color: var(--mute); font-size: 0.64rem; letter-spacing: 0.08em; text-align: right; }

  /* -- motion, only where he acts: opacity and transform, nothing running while he is idle */
  #halo, #all {
    opacity: 1;
    transition: opacity 220ms var(--ei), transform 220ms var(--ei), display 220ms allow-discrete;
  }
  #halo[hidden] { opacity: 0; transform: translateY(-6px); }
  #all[hidden] { opacity: 0; transform: translateY(8px); }
  @starting-style {
    #halo:not([hidden]) { opacity: 0; transform: translateY(-6px); }
    #all:not([hidden]) { opacity: 0; transform: translateY(8px); }
  }
  #mode .mi.in { animation: mode-in 260ms var(--ei); }
  #mode .w.in { animation: word-in 260ms ease-in-out; }
  @keyframes mode-in { from { opacity: 0; transform: scale(0.82); } }
  @keyframes word-in { from { opacity: 0; } }
  #halo .arcmark.in .mk, #halo .arcmark.in .nm, #all .ent.in .nm { animation: settle 260ms ease-in-out; }
  @keyframes settle { from { opacity: 0.25; } }

  /* -- the eye: the whole disc is the button, the swarm draws it -------------- */
  #talk { position: relative; display: grid; grid-template-rows: auto auto auto; justify-items: center; }
  #disc {
    -webkit-appearance: none;
    appearance: none;
    position: relative;
    display: block;
    width: 100%;
    height: clamp(15rem, 46svh, 38rem);
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    cursor: pointer;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #disc:disabled, #disc[data-state="offline"] { cursor: default; }

  /* -- a wide screen: the eye on the left, the words in their own column -------- */

    main {

<script>
"use strict";
/* The Swarm eye in raw WebGL2, vendored from ~/agents/dashboard/static/next: lab/js/{eye-c,engine,glsl,glyphs}.js and js/{gl/life,gl/creatures,gl/cam,avatar}.js. */
const Swarm = (() => {
  const V = "#version 300 es\nprecision highp float;\n";
  const PAL = `
const vec3 MINT = vec3(0.074, 1.0, 0.35);
const vec3 VIO = vec3(0.434, 0.074, 1.0);
const vec3 GOLD = vec3(1.0, 0.637, 0.133);
const vec3 ICE = vec3(0.347, 0.807, 1.0);
`;
  const H12 = "float h12(vec2 p){ vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }\n";

  const TRI = `${V}layout(location = 0) in vec2 position;
void main(){ gl_Position = vec4(position, 0.0, 1.0); }`;

  const BG = `${V}uniform vec3 uEye, uIris; uniform vec2 uCam; uniform float uTime, uAct, uWarm, uAmp, uMic, uDim, uKick; uniform sampler2D uAtlas;
out vec4 oCol;
${PAL}${H12}
vec2 glyph(float id, vec2 c, vec2 dx, vec2 dy){
  vec2 uv = (vec2(mod(id, 8.0), floor(id / 8.0)) + 0.1 + c * 0.8) / 8.0;
  return textureGrad(uAtlas, uv, dx * 0.1, dy * 0.1).rg;
}
vec3 bokeh(vec2 uv){
  vec3 c = vec3(0.0);
  for (int l = 0; l < 2; l++) {
    float fl = float(l), sc = mix(3.0, 5.0, fl);
    vec2 p = uv * sc + uCam * mix(8.0, 16.0, fl) + vec2(fl * 0.37, -uTime * mix(0.025, 0.05, fl));
    vec2 ci = floor(p), cf = fract(p);
    float h = h12(ci + fl * 31.0);
    if (h > 0.2) continue;
    vec2 o = vec2(h12(ci + 7.0), h12(ci + 13.0)) * 0.4 + 0.3;
    vec2 gu = (cf - o) * mix(2.4, 3.2, fl) + 0.5;
    float mask = 1.0 - smoothstep(0.3, 0.5, length(gu - 0.5));
    float bl = mix(0.34, 0.2, fl);
    vec2 g = glyph(floor(h12(ci + 3.0) * 61.0), clamp(gu, 0.0, 1.0), vec2(bl, 0.0), vec2(0.0, bl));
    float tw = 0.55 + 0.45 * sin(uTime * (0.4 + 2.0 * h) + h * 60.0);
    c += mix(uIris, MINT, step(0.09, h)) * (g.x + g.y * 0.5) * mask * tw * mix(0.035, 0.06, fl);
  }

}
void main(){
  vec2 uv = (gl_FragCoord.xy - uEye.xy) / uEye.z;
  float r = length(uv * vec2(1.0, 1.6)), e = length(uv * vec2(1.0, 1.4));
  vec3 col = bokeh(uv) + mix(MINT * 0.5 + uIris * 0.5, GOLD, uWarm) * 0.012 * (0.5 + uAct) * exp(-1.6 * max(r - 0.4, 0.0));
  col += GOLD * uWarm * (0.016 + 0.06 * uMic) * exp(-abs(e - 1.3) * 6.0);
  col += uIris * uAmp * 0.06 * exp(-1.4 * max(r - 0.45, 0.0));
  float f = uKick / 0.9;
  if (f < 1.0) col += mix(MINT, GOLD, uWarm) * exp(-abs(e - 1.05 - f * 2.8) * 16.0) * (1.0 - f) * (1.0 - f) * 0.35;
  oCol = vec4(max(col * (1.0 - 0.55 * uDim), 0.0), 1.0);
}`;

  const PTS = `${V}layout(location = 0) in vec3 position;
layout(location = 1) in vec4 meta;
uniform vec3 uEye, uGaze, uIris; uniform vec2 uCam, uPx; uniform vec4 uLid, uFlash;
uniform float uPupil, uTime, uAct, uForm, uSpin, uWhirl, uSwirl, uGather, uWarm, uAmp, uMic, uDim, uRing, uRingR, uTurn;
out vec3 vCol; out vec2 vCell; out float vSharp;
${PAL}
const float D = 7.0, RL = 1.085, IR = 0.52, DI = 0.8, PI2 = 6.2831853;
float h11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
vec2 lidsAt(vec3 n){
  float a = atan(n.x, n.z), e = asin(clamp(n.y, -1.0, 1.0));

void main(){
  float kind = meta.x, seed = meta.y, size = meta.w, a = 1.0;
  mat3 B = basis(uGaze);
  vec3 p, col, edge = mix(MINT, GOLD, uWarm);
  float ring = 0.0;
  if (kind > 6.5) {
    float th = PI2 * 0.25 - (position.x + uTurn) * PI2, R = uRingR * (1.0 + 0.02 * (h11(seed * 2.0) - 0.5));
    p = vec3(cos(th) * R, sin(th) * R * 0.6726, -sin(th) * R * 0.74);
    if (p.z < 0.0) a *= smoothstep(RL * 0.9, RL * 1.12, length(p.xy));
    col = mix(MINT, uIris, step(0.8, h11(seed * 5.0))) * 0.22 * uRing * (0.35 + 0.65 * pow(h11(seed * 7.0 + floor(uTime * 0.6 + seed)), 2.0));
  } else if (kind < 0.5 || kind > 4.5) {
    float rn = position.x, dir = mod(floor(rn * 9.0), 2.0) * 2.0 - 1.0;
    float th = position.y * PI2 + uSpin * position.z * dir;
    float r = mix(uPupil * IR + 0.02, IR - 0.01, rn);
    r *= 1.0 + 0.05 * uFlash.a * sin(rn * 14.0 - uFlash.a * 6.0) + 0.07 * uAmp * sin(rn * 11.0 - uTime * 9.0) + 0.05 * uMic * sin(rn * 7.0 + uTime * 5.0);
    p = B * vec3(cos(th) * r, sin(th) * r, DI + 0.07 * (1.0 - rn));
    ring = kind > 4.5 ? 1.0 : 0.0;
    col = mix(MINT * 0.85, uIris * 0.6, smoothstep(0.35, 0.8, rn)) * mix(1.0, 0.6, rn);
    col *= 0.3 + 1.4 * pow(h11(seed * 7.0 + floor(uTime * 0.8 + seed)), 3.0);
    col = mix(col, mix(edge, uFlash.rgb, uFlash.a) * (1.4 + 5.0 * uFlash.a + 3.0 * uAmp + 2.0 * uMic), ring);
    col *= (0.6 + 0.4 * uAct) * (1.0 + 0.9 * uAmp);
  } else if (kind < 1.5) {
    vec3 q = position;
    q.xy = rot(q.xy, uWhirl * (0.35 + 1.3 * h11(seed * 5.3)));
    p = B * q;
    col = mix(vec3(0.32, 0.5, 0.44), GOLD * 0.6, uWarm * 0.35) * 0.3 * (0.4 + 0.6 * smoothstep(0.1, 0.8, position.z));
  } else if (kind < 3.5) {
    float az = position.x, d = position.y;
    float s = max(1.0 - az * az, 0.0);
    float eu = uLid.x * pow(s, 0.62) - 0.03 * (1.0 - s), el = -uLid.y * pow(s, 0.95);
    float m = mix(el, eu, 0.22);
    eu = mix(eu, m, uLid.z); el = mix(el, m, uLid.z);
    float e = kind < 2.5 ? eu + d : el - d;
    p = (RL + 0.02 * d) * vec3(cos(e) * sin(az), sin(e), cos(e) * cos(az));
    float edg = exp(-d / 0.012);
    col = mix(uIris * 0.16, mix(edge, uFlash.rgb, uFlash.a) * (0.8 + 0.7 * uAct + 3.0 * uFlash.a + 1.2 * uAmp), edg) * exp(-d / 0.2) * smoothstep(1.0, 0.6, abs(az));
  } else {
    float g = clamp(uGather * 1.5 - h11(seed * 8.3) * 0.5, 0.0, 1.0);
    g = g * g * (3.0 - 2.0 * g);
    float an = h11(seed * 1.7) * PI2 + uWhirl * (0.25 + 0.45 * h11(seed * 2.3)), rr = 1.3 + 0.7 * h11(seed * 4.1);
    vec3 aura = vec3(cos(an) * rr, sin(an) * rr * 0.62, 0.2 + 0.5 * (h11(seed * 6.7) - 0.5));
    p = mix(position, aura, g);
    col = mix(mix(uIris, MINT, step(0.7, h11(seed))), GOLD, uWarm * g) * (0.05 + 0.3 * g);
    float w = clamp(uSwirl * 1.4 - h11(seed * 8.9) * 0.4, 0.0, 1.0), ph = fract(h11(seed * 3.9) - uTime * (0.08 + 0.1 * h11(seed * 7.7)));
    float vr = 0.3 + 1.7 * ph, va = step(0.5, h11(seed * 5.9)) * 3.1416 + 1.9 * log(vr) - uWhirl * 0.35 + 0.55 * (h11(seed * 2.9) - 0.5);
    w = w * w * (3.0 - 2.0 * w);
    p = mix(p, vec3(cos(va) * vr, sin(va) * vr * 0.62, 0.9), w);
    col = mix(col, mix(uIris, MINT, step(0.7, h11(seed))) * (0.12 + 0.5 * (1.0 - ph)) * smoothstep(0.0, 0.12, ph), w);
  }
  if (kind < 1.5 || (kind > 4.5 && kind < 5.5)) {
    vec2 ld = lidsAt(normalize(vec3(p.xy, sqrt(max(RL * RL - dot(p.xy, p.xy), 0.0)))));
    a *= smoothstep(-0.005, 0.03, min(ld.x, ld.y)) * step(0.0, p.z);
  }
  float f = smoothstep(0.0, 1.0, clamp(uForm * 1.6 - h11(seed * 3.0) * 0.6, 0.0, 1.0));
  float sa = h11(seed) * PI2 + (1.0 - f) * 2.0, sr = 1.4 + 2.2 * h11(seed + 4.0);
  vec3 scatter = vec3(cos(sa) * sr * 1.3, (h11(seed + 1.0) - 0.5) * 2.2, sin(sa) * sr * 0.5 - 0.6);
  p = mix(scatter, p, f);
  float cy = cos(uCam.x), sy = sin(uCam.x), cp = cos(uCam.y), sp = sin(uCam.y);
  mat3 Rc = mat3(cy, 0.0, -sy, 0.0, 1.0, 0.0, sy, 0.0, cy) * mat3(1.0, 0.0, 0.0, 0.0, cp, -sp, 0.0, sp, cp);
  p = p * Rc;
  float w = D - p.z;
  vec2 uv = p.xy * D / (w * 1.0104);
  gl_Position = vec4((uEye.xy + uv * uEye.z) * uPx * 2.0 - 1.0, 0.0, 1.0);

  gl_PointSize = min(px * (1.0 + blur), 96.0);
  vec3 c = mix(mix(MINT, uIris, step(0.55, h11(seed * 11.0))) * 0.35, col * a, f) / (1.0 + blur * blur * 2.5);
  vCol = mix(c, vec3(dot(c, vec3(0.2126, 0.7152, 0.0722))), uDim * 0.7) * (1.0 - 0.6 * uDim);
  float gid = floor(fract(meta.z + floor(uTime * (0.3 + 2.0 * h11(seed * 5.0)) + seed * 13.0) * 0.618 * step(0.6, h11(seed * 9.0))) * 61.0);

}`;

  const PTF = `${V}uniform sampler2D uAtlas;
in vec3 vCol; in vec2 vCell; in float vSharp;
out vec4 oCol;
void main(){
  vec2 uv = (vCell + 0.1 + gl_PointCoord * 0.8) / 8.0;
  vec2 g = texture(uAtlas, uv, (1.0 - vSharp) * 2.5).rg;
  float v = mix(g.y * 0.6, g.x + g.y * 0.25, vSharp);
  if (v < 0.004) discard;
  oCol = vec4(vCol * v, 1.0);
}`;

  const CVS = `${V}layout(location = 0) in vec2 position;
layout(location = 1) in vec4 iPos;
layout(location = 2) in vec4 iCol;
layout(location = 3) in vec4 iShp;
layout(location = 4) in vec4 iMor;
layout(location = 5) in vec4 iDec;
layout(location = 6) in vec4 iSt;
layout(location = 7) in vec4 iMo;
layout(location = 8) in vec4 iLt;
uniform vec2 uRes;
out vec2 vL;
flat out vec4 vCol, vShp, vMor, vDec, vSt, vMo, vLt;
flat out float vPx, vFade;
const float Q = 2.2;
void main(){
  vec2 px = iPos.xy + position.xy * iPos.z * 0.5 * Q;
  gl_Position = vec4(px / uRes * 2.0 - 1.0, 0.0, 1.0);
  vL = position.xy * Q;
  vPx = 2.0 / max(iPos.z, 1.0);
  vFade = iPos.w;
  vCol = iCol; vShp = iShp; vMor = iMor; vDec = iDec; vSt = iSt; vMo = iMo; vLt = iLt;
}`;

  const CFS = `${V}in vec2 vL;
flat in vec4 vCol, vShp, vMor, vDec, vSt, vMo, vLt;
flat in float vPx, vFade;
uniform float uTime; uniform sampler2D uAtlas;
out vec4 o;
${PAL}
float W, H, LOB, WOB, PH, SQ, NE, TOP, SX, SY, ES, EY, SEED;
vec3 EC0, EC1, EC2; bool OPEN;
float hs(float x){ return fract(sin(x * 91.345 + SEED * 311.7) * 43758.5453); }
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
float sdEll(vec3 p, vec3 r){ float k0 = length(p / r), k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / max(k1, 1e-5); }
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
float sdCone(vec3 p, vec3 a, vec3 b, float r1, float r2){ vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - mix(r1, r2, h); }
float body(vec3 p){
  float rho = length(vec2(p.x / W, p.z / (W * 0.8))), y = p.y / H;
  float a = atan(y, max(rho, 1e-4)), c = abs(cos(a)), s = abs(sin(a));
  float k = pow(pow(c, SQ) + pow(s, SQ), -1.0 / SQ);
  float rr = k * (1.0 + WOB * sin(LOB * a + PH)) * mix(0.96, 1.05, smoothstep(0.25, -0.35, y));
  return (length(vec2(rho, y)) - rr) * min(W * 0.8, H) * 0.86;
}
float feet(vec3 p){ return sdEll(vec3(abs(p.x), p.y, p.z) - vec3(0.4 * W, -0.98 * H, 0.2), vec3(0.25, 0.13, 0.21)); }
float eyes(vec3 p){
  if (!OPEN) return 1e3;

  if (NE > 1.5) d = min(d, length(p - EC1) - ES);
  if (NE > 2.5) d = min(d, length(p - EC2) - ES);

vec3 antTip(){ return vec3(0.55 * W + 0.26 * vDec.w, H + 0.44 + 0.16 * hs(2.0), 0.06); }
float topper(vec3 p, out float tip){
  tip = 1e3;
  vec3 q = vec3(abs(p.x), p.y, p.z);
  if (TOP < 0.5) {
    vec3 b = vec3(0.3 * W, 0.86 * H, 0.0), t = antTip(), m = vec3(mix(b.x, t.x, 0.35), mix(b.y, t.y, 0.7), 0.03);

/** The renderer on the page's canvas, or the CSS eye where WebGL2 is missing or refused. */

/** What the eye does in each state: how open and lively, gathered to listen, swirling to think, gold for him, dim and loose when cut off. */
const MOOD = {
  locked: { open: 0.06, act: 0.1, gather: 0, swirl: 0, warm: 0, dim: 0.35, err: 0 },
  ready: { open: 1, act: 0.3, gather: 0, swirl: 0, warm: 0, dim: 0, err: 0 },
  listening: { open: 1, act: 0.85, gather: 1, swirl: 0, warm: 1, dim: 0, err: 0 },
  thinking: { open: 1, act: 0.7, gather: 0.3, swirl: 1, warm: 0, dim: 0, err: 0 },
  speaking: { open: 1, act: 1, gather: 0, swirl: 0.15, warm: 0, dim: 0, err: 0 },
  offline: { open: 0.55, act: 0.05, gather: 0, swirl: 0, warm: 0.6, dim: 0.55, err: 1 },

/** His voice level from one worklet block, which the iris answers while he talks. */

/** The eye on the disc, smaller while agents orbit it; their ring is wide only where the eye stays big inside it. */

/** One frame: mood, voice and life eased by the time since the last, the creatures placed, one draw. */

  eye.last = now;

  eye.E = E;
  const lid = Math.round(E.y - E.r * 0.62 - talk.getBoundingClientRect().top - 30) + "px";

    lid: [v.lid[0] + 0.06 * eye.gather, v.lid[1] + 0.04 * eye.gather, Math.max(v.lid[2], 1 - eye.open), v.lid[3]],
    flash: v.flash, pupil: Math.min(0.78, v.pupil + 0.16 * eye.gather + 0.1 * eye.amp + 0.08 * eye.mic),

const decoders = new Set();
const busy = () => decoders.size > 0;

/** Nothing to draw for: hidden or unfocused, and no window of its own holding the eye. */
const away = () => (document.hidden || !focused) && !pip;
/** The open page is never a still one: the eye lives in every state while he can see it. */
const idling = () => !!GL && !STILL && !away();

/** One frame after another while he can see it; nothing at all while he is away. */
function frame(now) {
  raf = 0;
  const gap = GL?.S.soft ? 40 : 0; // a software renderer paints at 25 fps
  if (!gap || now - eye.drawn >= gap) {
    if (GL && eye.drawn && now - eye.drawn < 100) GL.track(now - eye.drawn);
    eye.drawn = now;
    paint(now);
  }
  for (const d of decoders) d.step(now);

const park = () => { if (raf) { host.cancelAnimationFrame(raf); raf = 0; } };
/** A still eye for those who asked for no motion: every state as one settled frame. */
function still() {

}
addEventListener("resize", () => (STILL ? still() : wake()));
// the desk's pointer: the eye follows it while it moves, and lets go when it rests
addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse" || !eye.E) return;
  gaze.setPointer((e.clientX - eye.E.x) / eye.E.r, (eye.E.y - e.clientY) / eye.E.r, eye.t);

/** A new state: thinking looks up and away, a lock sends the agents home; the frames do the rest. */
function mood(name) {
  if (name === "thinking") gaze.look(-0.35, 0.45, eye.t, 2.4);
  if (name === "locked") { crowdSeen.clear(); crowdSet([]); }
  if (STILL) return still();
  wake();
}

// -- the agents at work (`eye status`), as creatures on a ring around the eye ----
const CROWD_MS = 20_000, CROWD_MIN_MS = 6000;
let crowdTimer = 0, crowdGone = false, crowdHold = 0, crowdLast = [];
const crowdSeen = new Map(); // id → {o, at}: when each one first came, so a short one still gets its moment
/** The fallback pull: the body pushes every change on the long-poll, this catches what a dropped poll missed. */
async function crowdPull() {
  clearTimeout(crowdTimer);
  if (crowdGone || document.hidden || disc.disabled) return;
  const r = await fetch("/remote/orbiters").catch(() => null);
  if (r?.status === 404) return void (crowdGone = true); // a body from before the route
  if (r?.ok) crowdSet((await r.json().catch(() => null))?.orbiters);
  crowdTimer = setTimeout(crowdPull, CROWD_MS);
}
addEventListener("visibilitychange", () => { if (!document.hidden) crowdPull(); });
crowd.onLeave = () => gaze.event("info", null, null, eye.t);

/** The ring follows the list: newcomers climb out of the eye, the gone leap and fall back in, and the eye looks at each. */
function crowdSet(body) {
  if (!Array.isArray(body)) return;
  clearTimeout(crowdHold);
  crowdLast = body;
  const now = performance.now(), list = body.filter((o) => typeof o?.id === "string");
  let wait = Infinity;
  for (const [id, s] of crowdSeen) {
    if (list.some((o) => o.id === id)) continue;
    const left = s.at + CROWD_MIN_MS - now;
    if (left > 0) { list.push(s.o); wait = Math.min(wait, left); } else crowdSeen.delete(id);
  }
  for (const o of list) if (!crowdSeen.has(o.id)) crowdSeen.set(o.id, { o, at: now });
  if (wait < Infinity) crowdHold = setTimeout(() => crowdSet(crowdLast), wait + 20);

  const n = crowd.set(list.slice(0, 24), eye.t);
  const come = crowd.ids().find((id) => !was.has(id));
  if (come || gone) sfx?.chime(!!come);
  if (come && was.size) { const p = crowd.spot(come, R); if (p) gaze.look(p[0], p[1], eye.t, 1.2); }

  crowdEl.hidden = !n;
  gaze.setData({ load: Math.min(1, n / 6) });

}

// -- the decode: words resolving out of katakana noise, 38 a second, as on the TV
const CPS = 38;
/** The text an element shows, and the moment each character resolves. */
function decoder(el) {
  const d = { el, text: "", at: [], noise: [], done: true };
  /** New text: what was already there keeps its moments, the rest resolves from now across `ms`. */
  d.set = (text, ms = 0, from = performance.now()) => {
    let p = 0;
    while (p < d.text.length && p < text.length && d.text[p] === text[p]) p++;
    const fresh = [...text.slice(p)].filter((c) => c !== " ").length;
    const cps = ms > 0 && fresh ? Math.min(CPS, (fresh * 1000) / ms) : CPS;
    d.at.length = d.noise.length = p;
    for (let i = p, k = 0; i < text.length; i++) {
      d.at.push(STILL ? 0 : from + (k / cps) * 1000);
      d.noise.push(kata());
      if (text[i] !== " ") k++;
    }
    d.text = text;
    d.done = false;
    if (from === Infinity) decoders.delete(d); // held for its voice: nothing to step until reveal
    else { decoders.add(d); wake(); }
    d.step(performance.now());
  };
  /** Hide every character until `reveal` — a reply waits for its own voice. */
  d.hold = (text) => { d.set(text, 0, Infinity); };
  // also re-reveals a decode still in flight: a voice cut mid-word must not leave its words scrambling on the old clock
  d.reveal = (ms) => { if (!d.done) { d.text = ""; d.set(d.el.dataset.text, ms); } };
  d.step = (now) => {
    const runs = [];
    let cur = null, all = true;
    for (let i = 0; i < d.text.length; i++) {
      const dt = d.at[i] - now;
      const st = dt <= 0 ? (dt > -160 ? "h" : "") : dt < 900 ? "n" : null;
      if (st !== "") all = false;
      if (st === null) continue;
      if (st === "n" && Math.random() < 0.25) d.noise[i] = kata();
      const ch = st === "n" ? (d.text[i] === " " ? " " : d.noise[i]) : d.text[i];
      if (cur && cur.st === st) cur.s += ch;
      else runs.push((cur = { st, s: ch }));

    const keep = [...el.children].filter((c) => c.tagName === "BUTTON"); // his ▶ outlives every decode step

    if (all) { d.done = true; decoders.delete(d); }
    else if (el === log.lastElementChild) log.scrollTop = log.scrollHeight;
  };
  return d;
}

// -- the state ---------------------------------------------------------------
let ctx = null, node = null, stream = null;
let recording = false, tapId = null, failsafe = null, blocks = [], seq = 0, polling = false;
let utt = null, outSeq = 0, streamed = 0, flushing = false;
let paused = false, mutedAt = 0; // the iPhone's mute while he is away, and the wall clock it began on
let liveEl = null; // the gold line growing under his thumb
let offline = false;
const queue = []; // replies decoded and waiting their turn, one WAV at a time
let playing = null; // the item sounding now, held so an interruption can hand it back
let src = null; // the node sounding it: `cut()` stops this one, and only this one's end may ack
let poll = null, thinking = null;
let mode = "call"; // call, or audio notes — the active channel's, never a setting of the whole Eye
let boot = null; // the body's life these seqs belong to: a restart counts the ring from 0 again
/** The eye stops waiting on a reply — and with it the reason a hidden tab keeps polling. */
const unbrood = () => { clearTimeout(thinking); thinking = null; };

/** `eye ack`: heard, and nothing to say — a nod and "Understood" (the chime in notes mode, or before the clip is ready), and the eye stops thinking. */
function nod() {

  unbrood();
  gaze.event("ack", null, null, eye.t);

    const s = ctx.createBufferSource();
    s.buffer = understood;
    s.connect(ctx.destination);

/** The eye's mood and the line under it, together: one state, one sentence. */
const state = (name, text, warn) => {
  if (name && name !== disc.dataset.state) {
    disc.dataset.state = name;
    mood(name);
    sfx?.state(name);
    try { navigator.vibrate?.(10); } catch {}
  }
  if (text !== said) {
    said = text;
    if (text && !STILL) statusEl.animate?.([{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "none" }], { duration: 220, easing: "cubic-bezier(.12,.9,.24,1)" });

/** How many replies still have something unheard — which is what a ▶ is there for. */
const waiting = () => log.querySelectorAll("button.play").length;
const ready = () => {
  const n = waiting(); // in call mode a ▶ exists only where the page could not play it

};
const warn = (text) => state(null, text, true);

// -- the caption: whose line it is, and how the exchange is heard ------------
const caption = $("caption"), halo = $("halo"), all = $("all"), moreBtn = $("more");

const post = (path, body) =>
  fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).catch(() => null);

const nameOf = (c) => c.label || c.name;
/** Two letters that stay readable at thirty channels: the initials, else the first two. */
function markOf(c) {
  const words = nameOf(c).trim().split(/[\s._·-]+/).filter(Boolean);

/** How many replies a channel is holding for him — H09's field, absent until it lands. */

/** What the index says a row is doing, in his words. */

/** The mode: the active channel's, as a picture and his own word for it. */

/** One mark: two letters in the channel's colour, its name under it, a dot if it holds replies. */
function arcmark(c) {

/** One row of the index: the same identity, with what a bare list cannot tell him. */

/** Whatever the body reports, at any roster size — no count is assumed anywhere. */

}

function openHalo(on) {
  halo.hidden = !on;
  chanBtn.setAttribute("aria-expanded", String(on));
  moreBtn.hidden = !on;
  if (!on) return void openAll(false);
  sfx?.whoosh();
  drawHalo();
  halo.querySelector('[aria-current="true"]')?.focus();
}

function openAll(on) {
  all.hidden = !on;
  moreBtn.setAttribute("aria-expanded", String(on));
  if (!on) return;
  sfx?.whoosh();
  drawAll();
  all.querySelector('[aria-current="true"]')?.focus();
}

/** One tap: the body switches and answers the roster, which is what the caption redraws from. */
async function pick(name) {
  if (!name || name === chan) return;
  chanBtn.disabled = true;
  const r = await post("/remote/active", { brain: name }); // the id, never the label
  chanBtn.disabled = false;
  if (r && r.status === 401) return locked();
  if (r && r.ok) return roster(await r.json());
  warn("The switch did not happen · try again");
}

/** One tap on the mode: it moves the active channel and no other. */
async function flip() {
  const want = mode === "call" ? "notes" : "call";
  modeBtn.disabled = true;
  const r = await post("/remote/mode", chan ? { mode: want, channel: chan } : { mode: want });
  modeBtn.disabled = false;
  if (r && r.status === 401) return locked();
  if (r && r.ok) {
    const m = (await r.json()).mode;
    const row = rowOf(chan);
    if (row && MODE_WORD[m]) row.mode = m; // the index follows the channel he just moved
    return drawMode(m);
  }
  warn("The mode did not change · try again");
}

chanBtn.addEventListener("click", () => openHalo(halo.hidden));
moreBtn.addEventListener("click", () => openAll(all.hidden));
modeBtn.addEventListener("click", flip);

/** One line in the transcript, `me` gold or `eye` green, with its decoder. */
function line(who, text, held) {
  const el = document.createElement("p");
  el.className = "line " + who;
  el.dataset.text = text;
  el.dec = decoder(el);
  held ? el.dec.hold(text) : el.dec.set(text);
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// -- the key ----------------------------------------------------------------

/** A fresh page starts from now — never from the 5-minute ring of replies already heard. */
async function enter() {
  gate.classList.add("hide");
  log.classList.remove("hide");
  disc.disabled = false;
  ready();
  const c = await life();
  // from the bottom of the ring, never its head: a reply that landed while the tab was closed
  // is unplayed, and the unplayed ones are what the body hands back
  seq = 0;
  boot = c?.boot ?? null;
  fetch("/remote/brains").then((b) => b.ok && b.json()).then((b) => b && roster(b)).catch(() => {});
  fetch("/remote/mode").then((m) => m.ok && m.json()).then((m) => m && drawMode(m.mode)).catch(() => {});
  crowdPull();
  loop();
}

/**
 * Back to the key field — the cookie is gone or the body was restarted. The eye
 * closes, and the turn goes with it: a 401 mid-flush used to leave `recording`
 * true, so `begin()` refused after he logged back in and only a reload freed it.
 */
function locked() {
  drop();
  openHalo(false);
  gate.classList.remove("hide");
  log.classList.add("hide");
  disc.disabled = true;
  state("locked", "");
}

$("keyform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const key = $("key").value;
  $("key").value = ""; // it lives no longer than this line: the cookie is the session
  $("refused").textContent = "";
  const r = await fetch("/remote/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key }),
  }).catch(() => null);
  if (r && r.ok) return enter();
  eye.kick = eye.t; wake();
  $("refused").textContent = r ? "That key was refused" : "The body did not answer · check Tailscale";
});

wake(); // the closed eye assembles before the cookie is known
fetch("/remote/audio", { method: "POST", body: new Uint8Array(0) })
  .then((r) => (r.ok ? enter() : locked()))
  .catch(() => locked());

// -- tapping the eye --------------------------------------------------------

/** The mic, once: the stream and the worklet are kept, only the tap is switched. */
async function openMic() {
  if (node) return;
  stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1 } });
  await ctx.audioWorklet.addModule("worklet.js");
  node = new AudioWorkletNode(ctx, "downsampler");
  node.port.onmessage = (e) => {
    blocks.push(e.data);
    micLevel(e.data);
    if (blocks.length >= FLUSH_BLOCKS) flush(); // a message is a task, never a clamped timer
  };
  ctx.createMediaStreamSource(stream).connect(node);
  const [track] = stream.getAudioTracks();
  track.addEventListener("ended", stop);
  // only the iPhone ever fires these: it mutes the track the moment he looks elsewhere
  track.addEventListener("mute", () => {
    if (!recording) return;
    paused = true;
    state("listening", "Mic paused by the phone · come back to continue");
    mutedAt ||= Date.now(); // a timer would not survive the very absence this guards against; a second mute keeps the first one's clock
  });
  track.addEventListener("unmute", () => {
    paused = false;
    if (lost()) return;
    mutedAt = 0;
    if (recording) { state("listening", "Tap again to send"); flush(); }
  });
  const mute = ctx.createGain(); // a worklet only runs while it reaches a destination
  mute.gain.value = 0;
  node.connect(mute).connect(ctx.destination);
}

const fav = $("fav"), TITLE = document.title;
const ICON = fav.getAttribute("href");
const ICON_LIVE = ICON.replace("%23b04dff", "%23ffd166"); // a gold iris, his colour

/** The tab itself says a turn is open, for the turns he switched away from. */
const mark = (live) => {
  document.title = live ? `\u25cf listening \u00b7 ${TITLE}` : TITLE;
  fav.setAttribute("href", live ? ICON_LIVE : ICON);
};

/** Off the air: the gold goes out, the failsafe and the mute clock are dropped. */
function idle() {
  recording = false;
  tapId = null;
  paused = false;
  clearTimeout(failsafe);
  mutedAt = 0;
  mark(false);
  disc.setAttribute("aria-pressed", "false");
}

/**
 * His voice takes the page's: the reply sounding now — or the one a stopped context left
 * paused mid-word, which opening the mic would otherwise resume out loud into it — is
 * stopped and handed back to the head of the tray with its ▶, the way the room's barge-in
 * drops the remainder (M08 §3). Nothing of it is acked: the next press plays it from the
 * start, so the glyph is still there because something of it is genuinely unheard.
 */
function cut() {
  if (!playing) return;
  const s = src;
  src = null; // its `onended` now knows he did not hear it out
  try { s?.stop(); s?.disconnect(); } catch {}
  queue.unshift(playing);
  playing = null;
  offer();
}

/** The first tap of the pair: gold eye, open mic, and the failsafe on the clock. */
async function begin() {
  if (recording || offline) return;
  cut(); // before the mic, and before `unlock()` resumes what it was sounding
  const opened = unlock(); // started inside the gesture; awaited with the mic below
  recording = true;
  blocks = [];
  utt = Math.random().toString(36).slice(2, 10);
  outSeq = 0;
  streamed = 0;
  liveEl = null;
  unbrood();
  mark(true);
  disc.setAttribute("aria-pressed", "true");
  state("listening", "Tap again to send");
  failsafe = setTimeout(stop, MAX_MS);
  try {
    await opened; // no context, no worklet: the mic cannot be opened either, and the mouth is shut too
  } catch {
    idle();
    return state("ready", "This device will not open audio \u00b7 it cannot hear or speak", true);
  }
  try {
    await openMic();
  } catch (err) {
    idle();
    return state("ready", "Microphone refused · allow it for this site", true);
  }
  if (recording) node.port.postMessage("on");
}

/**
 * A second of his voice on its way, in order: the blocks the worklet has handed
 * over since the last one. A block that fails keeps its seq and goes again — the
 * body appends by number, so nothing lands out of order.
 */
async function flush() {
  if (flushing || paused || !utt || !blocks.length) return;
  flushing = true;
  const body = concat(blocks.splice(0));
  const id = utt;
  const r = await fetch(`/remote/stream?utt=${id}&seq=${outSeq}`, {
    method: "POST",
    headers: { "Content-Type": "application/octet-stream" },
    body,
  }).catch(() => null);
  if (r && r.ok) {
    outSeq++;
    streamed += body.length;
  } else if (r && r.status === 401) {
    flushing = false;
    return locked();
  } else if (r && r.status === 413) {
    flushing = false;
    warn("That is all one turn holds · sending it");
    return void stop();
  } else blocks.unshift(body); // the tunnel blinked: the same seq goes again
  flushing = false;
}

/** The turn is let go: off the air, the tail discarded, the growing line removed. */
function drop() {
  utt = null;
  idle();
  unbrood();
  node?.port.postMessage("off");
  blocks = [];
  liveEl?.remove();
  liveEl = null;
}

/**
 * A pause the body outwaited: real elapsed time, because the page the phone pauses
 * is the page whose timers are suspended. The turn is gone, so nothing is sent.
 */
function lost() {
  if (!recording || !mutedAt || Date.now() - mutedAt < MUTE_MAX_MS) return false;
  drop();
  state("ready", "The mic stayed paused too long · the body let that turn go · tap to say it again", true);
  return true;
}

/** The second tap — or the failsafe, or the mic ending: send what was captured. */
async function stop() {
  if (!recording || lost()) return;
  const id = utt;
  utt = null; // no partial after the tap: the line he has is the one that settles
  idle();
  node?.port.postMessage("off"); // which also flushes the tail block
  await new Promise((r) => setTimeout(r, 60));
  while (flushing) await new Promise((r) => setTimeout(r, 30)); // the tail goes last
  const tail = concat(blocks.splice(0));
  const send = (body) =>
    fetch(`/remote/audio?utt=${id}`, {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream" },
      body,
    });
  if (streamed + tail.length < MIN_SAMPLES) {
    send(tail).catch(() => {}); // nothing worth hearing, but the body's buffer goes free
    return state("ready", "Too short · tap, say it, tap again", true);
  }
  state("thinking", "Thinking");
  const r = await send(tail).catch(() => null);
  if (!r) return state("ready", "No answer · check Tailscale, then tap again", true);
  if (r.status === 401) return locked();
  const { transcript } = await r.json();
  settle(transcript);
}

/** His words as they are said: one gold line that keeps resolving as it grows. */
function grow(id, text) {
  if (id !== utt || !text) return;
  if (!liveEl) liveEl = line("me", text);
  else {
    liveEl.dataset.text = text;
    liveEl.dec.set(text);
    log.scrollTop = log.scrollHeight;
  }
}

/** The final transcript takes the growing line's place — the same line, settled. */
function settle(text) {
  if (!text) {
    liveEl?.remove();
    liveEl = null;
    return state("ready", "Nothing came back for that turn · tap to say it again", true);
  }
  if (liveEl) { liveEl.dataset.text = text; liveEl.dec.set(text); }
  else line("me", text);
  liveEl = null;
  thinking = setTimeout(() => { thinking = null; state("ready", "No reply came · tap to ask again", true); }, 60_000); // the eye does not brood all night
}

/** One tap in, one tap out — a toggle, not a walkie-talkie. */
function toggle(e) {
  e.preventDefault();
  if (disc.disabled) return;
  if (recording) return void stop();
  tapId = e.pointerId ?? null;
  begin();
}

/** The Int16 blocks of one recording, end to end. */
function concat(parts) {
  const total = parts.reduce((n, p) => n + p.length, 0);
  const out = new Int16Array(total);
  let i = 0;
  for (const p of parts) {
    out.set(p, i);
    i += p.length;
  }
  return out;
}

// the ring answers the touch at once; the turn waits for the release. A thumb that travels
// more than 10 px is a scroll, not a tap, and a press held on an open mic lets the turn go
const DRAG_PX = 10, HOLD_MS = 600;
let press = null; // the pointer down on the eye: {id, x, y, moved, timer}
disc.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (disc.disabled) return;
  eye.kick = eye.t; // the ring answers the touch on the next frame, whatever follows
  wake();
  clearTimeout(press?.timer);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false, timer: null };
  if (recording) press.timer = setTimeout(() => {
    press = null; // the release after a long press is not a tap
    drop();
    state("ready", "Turn dropped \u00b7 tap to start again", true);
  }, HOLD_MS);
});
disc.addEventListener("pointermove", (e) => {
  if (!press || e.pointerId !== press.id || press.moved) return;
  if (Math.hypot(e.clientX - press.x, e.clientY - press.y) <= DRAG_PX) return;
  press.moved = true;
  clearTimeout(press.timer);
});
disc.addEventListener("pointerup", (e) => {
  if (!press || e.pointerId !== press.id) return;
  const { moved, timer } = press;
  clearTimeout(timer);
  press = null;
  if (!moved) toggle(e);
});
// a cancel on the press that is down does nothing; on the tap that started the turn it is not
// a release; any other one is an interruption
disc.addEventListener("pointercancel", (e) => {
  if (press && e.pointerId === press.id) {
    clearTimeout(press.timer);
    press = null;
    return;
  }
  if (e.pointerId !== tapId) stop();
});
// the space bar is the desk's thumb, and 1..9 its finger on the channels
function keys(e) {
  const doc = e.target?.ownerDocument ?? document; // in its own window the disc has its own document
  if (e.repeat || disc.disabled || doc.activeElement === $("key")) return;
  if (e.key === "Escape") return void openHalo(false);
  if (e.code === "Space") return toggle(e);
  const c = DESK && /^Digit[1-9]$/.test(e.code) && chans[e.code[5] - 1];
  if (c) pick(c.name);
}
addEventListener("keydown", keys); // and on the PiP window too, where the disc may be living

// -- what comes back --------------------------------------------------------

const CURSOR_MS = 5000; // the loop is held while this is read: an answer that never comes must end
const POLL_TIMEOUT_MS = 60_000; // the body answers within 50 s: a socket that died without a word must not hang for minutes
const MISMATCH_MS = 1000; // a life no cursor read can name: the wait before asking again
const MISMATCH_MAX_MS = 30_000;
let mismatchMs = MISMATCH_MS;

/** The cursor, bounded, or null — `polling` is true while it is awaited. */
const life = () => {
  const stop = new AbortController();
  const t = setTimeout(() => stop.abort(), CURSOR_MS);
  return fetch("/remote/cursor", { signal: stop.signal })
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null)
    .finally(() => clearTimeout(t));
};

/**
 * Which life of the body a cursor read names. A page whose read at login failed holds no
 * life at all — it takes this one, from now, or restart detection would be off for as long
 * as he leaves the page open. One it already holds and no longer recognises is a restart.
 */
function adopt(c) {
  if (!c?.boot) return;
  if (!boot) {
    boot = c.boot;
    seq = Number(c.seq) || 0;
  } else if (c.boot !== boot) restarted(c);
}

/**
 * Which life of the body these seqs belong to, read back before this page polls again:
 * a hidden tab leaves the loop *cleanly*, so a restart under it would otherwise be met
 * with a dead life's cursor and every reply of the new one swallowed below it.
 */
async function resync() {
  adopt(await life());
}

/** One long-poll after another while the page is in front of him. */
async function loop() {
  if (polling) return;
  polling = true;
  try {
    if (!offline) await resync(); // while offline the branch below is the one that reads it
    // a turn in flight, a reply still coming or a window of its own all outlive the hide
    while (!document.hidden || recording || thinking || pip) {
      if (offline) {
        const c = await life(); // a quick answer, not a 50 s poll, says the tunnel is back
        if (!c) throw new Error("offline"); // the retry below is what tries again
        offline = false;
        if (!recording) ready();
        adopt(c); // and its word to him is the one that stands
      }
      poll = new AbortController();
      const dead = setTimeout(() => poll.abort(), POLL_TIMEOUT_MS);
      const r = await fetch("/remote/poll?since=" + seq, { signal: poll.signal }).finally(() => clearTimeout(dead));
      if (r.status === 401) return locked();
      // a restart between two polls drops an idle socket and nothing else: the next poll
      // answers for the new life, so its life rides every answer and is read here
      const answered = r.headers.get("X-Eye-Boot");
      // read before any resync: the reply this very answer carries is his, whatever life it names —
      // dropped here it never came back, because the new cursor is already past it
      const reply = await r.json();
      if (answered && answered !== boot) {
        const had = boot;
        await resync(); // the cursor of the life that answered, and his line if it is a new one
        // a read that named no life and an answer with nothing in it: no progress. Without this
        // wait the page polls the same swallowed answer as fast as the radio allows — his battery
        if (boot === had && !reply) {
          await new Promise((go) => setTimeout(go, mismatchMs));
          mismatchMs = Math.min(mismatchMs * 2, MISMATCH_MAX_MS);
          continue;
        }
        mismatchMs = MISMATCH_MS;
      }
      if (!reply) continue;
      seq = reply.seq;
      if (reply.partial !== undefined) {
        grow(reply.utt, reply.partial);
        continue;
      }
      if (reply.orbiters) {
        crowdSet(reply.orbiters);
        continue;
      }
      if (reply.ack) {
        nod();
        continue;
      }
      if (reply.brains || reply.mode) {
        roster(reply);
        continue;
      }
      if (reply.ready !== undefined) {
        nowReady(reply.ready);
        continue;
      }
      if (reply.link) {
        card(reply.link);
        ack(reply.seq); // drawn is delivered: a card is never played
        continue;
      }
      unbrood();
      // one he pressed ▶ for is played whatever the mode says; the rest play in call mode only
      const asked = reply.audio ? claim(reply.text) : null;
      const hear = !!reply.audio && (!!asked || mode === "call");
      // the words wait for the voice in both modes: in call mode for the one coming, in audio
      // notes mode for the press. A replay is the same reply, so it comes back on the pressed line.
      const el = asked ? asked.el : line("eye", reply.text || "…", hear || mode !== "call");
      const heard = hear && (await play(reply.audio, el, reply.seq));
      if (asked && !heard) asked.btn.disabled = false; // it came back unplayable: the press may be tried again
      // there only while unheard — and only once its voice exists: until then the quiet mark
      if (!heard && !asked) {
        if (reply.pending) waitMark(el, reply.seq);
        else playGlyph(el, reply.seq, reply.audio, reply.text);
      }
      if (!reply.audio || (hear && !heard)) ack(reply.seq);
      if (!heard && !recording) ready(); // the count follows the tray
    }
  } catch {
    if (!recording) {
      offline = true;
      state("offline", "Offline · reconnecting", true);
    }
    setTimeout(loop, 2000); // the tunnel dropped; it comes back
  } finally {
    polling = false;
  }
}

/**
 * The one place a context is made, so there is one place that hears it stop: a voice cut off
 * mid-buffer (iOS interrupting the tab) fires no `onended` until the context runs again, so
 * without this the paused reply and everything behind it would carry no ▶ and count as heard.
 * The buffer is not requeued — it resumes where it stopped, and the glyph is what resumes it.
 */
function audio() {
  if (ctx) return ctx;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.addEventListener("statechange", () => {
    if (ctx.state !== "running" && playing) offer();
  });
  fetch("understood.wav").then((r) => r.arrayBuffer()).then((b) => ctx.decodeAudioData(b)).then((b) => (understood = b), () => {});
  return ctx;
}

/** The reply decoded and queued: the voice waits its turn, and the words decode with it. False = those bytes are gone. */
async function play(url, el, n) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const bytes = await r.arrayBuffer();
    audio();
    queue.push({ buf: await ctx.decodeAudioData(bytes), el, n, life: boot });
    // behind a voice the context stopped, this one is unheard too — `pump()` offers for the same reason
    playing ? (ctx.state === "running" ? speaking() : offer()) : pump();
    return true;
  } catch {
    el.dec.reveal(); // the words stay; the body can say them again
    return false;
  }
}

/**
 * Replies this page asked to hear: the seq he pressed → the words it must come
 * back as. A replay is re-synthesised, so it lands as a new seq — the words are
 * what ties it to the press, and a reply nobody asked for cannot take its turn.
 */
const wanted = new Map(); // pressed seq → {text, el, btn, timer}
const WANTED_TTL_MS = 60_000; // a press whose words never came back gives the ▶ back

const norm = (t) => String(t ?? "").replace(/\s+/g, " ").trim();

/** The press these words answer, once — its line is where the replay is played and shown. */
function claim(text) {
  const words = norm(text);
  for (const [n, w] of wanted)
    if (w.text === words) {
      wanted.delete(n);
      clearTimeout(w.timer);
      return w;
    }
  return null;
}

/**
 * The glyph on an Eye line, put there only while something of that reply is
 * unheard: the original WAV while the ring still holds it, otherwise the body
 * says those words again — to this page, whichever mode it is in.
 */
function playGlyph(el, n, url, text) {
  const b = document.createElement("button");
  b.className = "play";
  b.type = "button";
  b.setAttribute("aria-label", "Play this reply");
  b.title = "Play this reply";
  b.innerHTML = '<svg viewBox="0 0 12 14" aria-hidden="true"><path d="M1 1l10 6-10 6z"/></svg>';
  b.addEventListener("click", async () => {
    if (b.disabled) return; // a press whose replay is still in flight asks for nothing more
    b.disabled = true;
    try {
      await unlock();
      // the line, not the seq: what is unheard there waits under the seq of the replay, not of the press
      if (playing?.el === el || queue.some((q) => q.el === el)) pump();
      else if (!url || !(await play(url, el, n))) return void (await replay(n, text ?? el.dataset.text, el, b));
      b.disabled = !!playing; // sounding: its own end takes the glyph. Still queued: he may press again
    } catch {
      warn("This device will not play sound"); // the glyph stays: the press may be tried again
      b.disabled = false; // a device that cannot open a context still gets a second press
    }
  });
  el.append(b);
  return b;
}

/**
 * Replies whose voice is still being made: the seq → the line holding a dim mark where its
 * ▶ will go. No press exists while it is there — a ▶ that starts nothing reads as broken —
 * and the body says on the poll lane, once, when the bytes are in hand or will never be.
 */
const notReady = new Map(); // reply seq → {el, mark}

/** The quiet mark: this reply is coming, and there is nothing to press yet. */
/** A tappable card on the log: the title, the host under it, the URL in a new tab. */
function card({ url, title }) {
  let host = url;
  try { host = new URL(url).host; } catch {}
  const el = document.createElement("p");
  el.className = "line eye link";
  const a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener";
  const t = document.createElement("span");
  t.textContent = title || host;
  const h = document.createElement("span");
  h.className = "host";
  h.textContent = host;
  a.append(t, h);
  el.append(a);
  log.append(el);
  log.scrollTop = log.scrollHeight;
}

function waitMark(el, n) {
  const mark = document.createElement("span");
  mark.className = "wait";
  mark.setAttribute("aria-label", "Preparing this reply");
  mark.title = "Preparing this reply";
  notReady.set(n, { el, mark });
  el.append(mark);
  return mark;
}

/** Its voice landed, or never will: the mark becomes the ▶ on that same line, in place. */
function nowReady(n) {
  const w = notReady.get(n);
  if (!w) return;
  notReady.delete(n);
  w.mark.remove();
  playGlyph(w.el, n);
  if (!recording) ready(); // the count follows the tray: this one can be pressed now
}

/**
 * The audio context opened *and* resumed inside his own press — the one moment iOS allows
 * either. Arrival may have opened it already, locked; on a page he has not touched yet it
 * does not exist, and creating it here is what makes one press enough.
 */
async function unlock() {
  audio();
  if (ctx.state !== "running") await ctx.resume().catch(() => {});
}

/**
 * Nothing left to play, or nothing ever made: those words again, on the poll lane, and onto
 * this same line when they come. The ▶ stays down until they do — one press, one synthesis,
 * however many times he presses — and comes back if they never do.
 */
async function replay(n, text, el, b) {
  // the press is on the books before the ask: the body publishes the replay while the POST is
  // still in the air, and the poll that carries it lands first on a loaded phone — a press that
  // was not there yet claimed nothing, so the reply took a second line and never played
  const timer = setTimeout(() => {
    if (!wanted.delete(n)) return;
    b.disabled = false;
    el.dec.reveal(); // the words were hidden for a voice that never came: they are his again
    warn("That reply did not come back \u00b7 \u25b6 to ask again");
  }, WANTED_TTL_MS);
  wanted.set(n, { text: norm(text), el, btn: b, timer });
  const r = await post("/remote/replay", { seq: n });
  if (r && r.ok) return void state(null, "Saying that again");
  const waited = wanted.delete(n); // false: the replay beat the answer and is already on his line
  clearTimeout(timer);
  if (r && r.status === 401) return locked();
  if (!waited) return;
  b.disabled = false;
  // the body's one-second gap between two presses is not a refusal: the press keeps
  if (r && r.status === 429) return void state(null, "One moment \u00b7 \u25b6 again");
  el.dec.reveal();
  warn("That reply cannot be said again");
}

/**
 * The body came back as a new life: it counts the ring from 0 again, so every seq on this page
 * names a reply that is gone — a ▶ pressed on one asks for someone else's words, and the stale
 * cursor swallows everything numbered below it. What the page can still play itself keeps its
 * glyph; the rest give up their words instead, once, with a line to him.
 */
function restarted(c) {
  boot = c.boot;
  // from the bottom of the new life, never from its head: what it has already said and he has
  // not heard is numbered below that cursor, and a page that starts above it never sees those
  seq = 0;
  for (const [n, w] of wanted) {
    clearTimeout(w.timer);
    wanted.delete(n);
  }
  for (const [n, w] of notReady) {
    notReady.delete(n);
    w.mark.remove();
    w.el.dec.reveal(); // its voice was being made by a body that is gone: the words are his
  }
  for (const el of log.querySelectorAll(".line.eye")) {
    if (playing?.el === el || queue.some((q) => q.el === el)) continue;
    if (!el.querySelector("button.play")) continue;
    el.dec.reveal();
    el.querySelector("button.play").remove();
  }
  warn("The Eye restarted \u00b7 unplayed replies are coming back");
}

/** A reply heard to the end never comes back on a reload — of the life that gave it, and no other. */
const ack = (n, life = boot) => post("/remote/ack", { seq: n, boot: life });

/**
 * One WAV at a time, in order; a suspended context — or his own open mic — stops the line
 * at a ▶ button. The page never speaks into the mic it is holding open: a reply that lands
 * during a turn joins the tray instead of playing into it.
 */
function pump() {
  if (playing || !queue.length) return;
  if (recording || ctx.state !== "running") return offer();
  const { buf, el, n, life } = (playing = queue.shift()); // the item is held while it sounds
  const s = (src = ctx.createBufferSource());
  s.buffer = buf;
  s.connect(voiceTap());
  s.onended = () => {
    if (s !== src) return; // stopped by `cut()`: he did not hear it out, so nothing is acked
    playing = null;
    src = null;
    ack(n, life);
    el.querySelector("button.play")?.remove(); // nothing of it is unheard now
    if (queue.length) return pump();
    if (!recording) ready();
  };
  s.start();
  el.dec.reveal(buf.duration * 1000); // the words keep pace with the voice, never faster than the TV
  speaking();
}
const speaking = () => state("speaking", queue.length ? `${queue.length} more waiting` : "");

/**
 * A suspended context never fails silently: the line's own glyph is what resumes it.
 * Decoding is not hearing, so the glyph is put there here — this is the one place that
 * knows the bytes are made and still unheard (a fresh page on iOS, where the context
 * was never opened by a gesture). Every reply waiting behind it is unheard too, and
 * carries its own ▶: one press drains them all, and the count says how many there are.
 * A voice the context stopped mid-word is in the tray as well — it is not heard yet either.
 */
function offer() {
  for (const item of playing ? [playing, ...queue] : queue) {
    item.el.dec.reveal();
    const b = item.el.querySelector("button.play");
    // a glyph in the tray is a reply he has not heard: one cut while it sounded left it down
    b ? (b.disabled = false) : playGlyph(item.el, item.n);
  }
  if (recording) return; // his open turn keeps the line under the eye; the tray is counted when it closes
  const many = (playing ? 1 : 0) + queue.length > 1;
  warn(`Tap \u25b6 on the ${many ? "replies" : "reply"} to hear ${many ? "them" : "it"}`);
}

// the phone's radio says so before a hanging poll would
addEventListener("offline", () => {
  if (!recording) {
    offline = true;
    state("offline", "Offline · reconnecting", true);
  }
});
addEventListener("online", () => poll?.abort()); // the hung poll fails now and the loop comes back
addEventListener("blur", () => { focused = false; park(); });
addEventListener("focus", () => { focused = true; eye.last = 0; wake(); });
addEventListener("visibilitychange", () => {
  if (document.hidden) return void park(); // the turn keeps running: only the animation parks
  focused = true;
  eye.last = 0;
  wake();
  lost(); // back from an absence longer than the body's patience
  if (!disc.disabled) loop();
});

// -- a small window of its own, so he can see and tap it from another tab ----
const mainEl = document.querySelector("main"), pipBtn = $("pip");
if (DESK && "documentPictureInPicture" in window) pipBtn.classList.remove("hide");

/** The eye, the state line and the disc in an always-on-top window; the mic never moves. */
async function keepVisible() {
  if (pip) return void pip.close();
  pip = await documentPictureInPicture.requestWindow({ width: 320, height: 300 });
  for (const s of document.querySelectorAll("style")) pip.document.head.append(s.cloneNode(true));
  park();
  pip.document.body.append(talk);
  pip.addEventListener("keydown", keys); // the keys follow the disc into its own window
  if (sfx) pip.addEventListener("pointerdown", touched, true);
  host = pip;
  pipBtn.setAttribute("aria-pressed", "true");
  pip.addEventListener("pagehide", () => {
    park();
    pip = null;
    host = window;
    mainEl.append(talk);
    pipBtn.setAttribute("aria-pressed", "false");
    eye.last = 0;
    wake();
  });
  eye.last = 0;
  wake();
  loop();
}
// a refusal is this attempt's, not the API's — the glyph stays, the feature detection owns hiding
pipBtn.addEventListener("click", () => keepVisible().catch(() => warn("That window was refused \u00b7 tap the glyph again")));
</script>
<script src="demo.js"></script>
</body>
